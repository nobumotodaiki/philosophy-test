<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理念テスト">
<title>理念テスト</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D;
    --surface: #161616;
    --card: #1E1E1E;
    --border: #2A2A2A;
    --accent: #C8A96E;
    --text: #F0EDE8;
    --muted: #8A8680;
    --success: #6EC8A0;
    --danger: #C86E6E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', 'Georgia', serif;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
  }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 7px 16px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  nav button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    position: relative;
    z-index: 1;
  }
  .page { display: none; }
  .page.active { display: block; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; margin-bottom: 6px; }
  .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 36px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  input, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: 1px solid var(--accent);
    padding: 11px 24px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn.outline {
    background: transparent;
    color: var(--accent);
  }
  .btn.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
    padding: 5px 12px;
    font-size: 9px;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .divider { border-top: 1px solid var(--border); margin: 28px 0; }
  .q-num { font-size: 10px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 10px; }
  .q-text { font-size: 16px; line-height: 1.7; margin-bottom: 16px; }
  .char-count { font-size: 10px; color: var(--muted); text-align: right; margin-top: 6px; }
  /* Score */
  .score-wrap { height: 3px; background: var(--border); margin-top: 8px; position: relative; overflow: hidden; }
  .score-fill { height: 100%; position: absolute; left: 0; top: 0; transition: width 1s ease; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px solid;
    margin-bottom: 10px;
  }
  /* Loading */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { font-size: 12px; color: var(--accent); letter-spacing: 0.1em; }
  /* Result */
  .result-header { text-align: center; margin-bottom: 40px; }
  .result-score { font-family: 'Cormorant Garamond', serif; font-size: 72px; font-weight: 300; line-height: 1; }
  .fb-section { margin-top: 16px; }
  .fb-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; }
  .fb-text { font-size: 13px; line-height: 1.7; color: var(--muted); }
  .answer-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    main { padding: 32px 14px 60px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-msg" id="loadingMsg">採点中...</div>
</div>

<header>
  <div class="logo">理念テストシステム</div>
  <nav>
    <button onclick="showPage('admin')" id="nav-admin">管理者設定</button>
    <button onclick="showPage('test')" id="nav-test">テストを受ける</button>
    <button onclick="showPage('result')" id="nav-result" style="display:none">結果を見る</button>
  </nav>
</header>

<main>
  <!-- ADMIN -->
  <div class="page" id="page-admin">
    <h1>管理者設定</h1>
    <div class="sub">会社理念と問題を登録してください</div>
    <div class="card">
      <div style="margin-bottom:18px">
        <label>会社名</label>
        <input id="companyName" placeholder="例：株式会社〇〇">
      </div>
      <div style="margin-bottom:18px">
        <label>会社理念・バリュー</label>
        <textarea id="philosophy" rows="5" placeholder="例：私たちは誠実さを第一に..."></textarea>
      </div>
      <button class="btn" onclick="saveSettings()">保存する</button>
    </div>
    <div class="divider"></div>
    <h1 style="font-size:20px">問題を追加</h1>
    <div class="sub" id="qCount">0 問登録済み</div>
    <div class="card">
      <div style="margin-bottom:16px">
        <label>問題文</label>
        <textarea id="newQ" rows="3" placeholder="例：当社の理念を踏まえ、クレーム対応の方針を述べてください。"></textarea>
      </div>
      <div style="margin-bottom:16px">
        <label>模範解答（任意）</label>
        <textarea id="newModel" rows="2" placeholder="AIが採点時に参考にします（省略可）"></textarea>
      </div>
      <button class="btn" onclick="addQuestion()">問題を追加</button>
    </div>
    <div id="qList"></div>
  </div>

  <!-- TEST -->
  <div class="page" id="page-test">
    <div id="testContent"></div>
  </div>

  <!-- RESULT -->
  <div class="page" id="page-result">
    <div id="resultContent"></div>
  </div>
</main>

<script>
const API = 'https://api.anthropic.com/v1/messages';
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxlzwPW7ruYuvi_GdZxHNzLiC8en2upLAQwQvyLxpYlUvpRxnEUwIJQPT2bsuXGUXNi/exec';
let questions = JSON.parse(localStorage.getItem('questions') || '[]');
let resultData = null;

// Init
document.getElementById('companyName').value = localStorage.getItem('companyName') || '';
document.getElementById('philosophy').value = localStorage.getItem('philosophy') || '';
renderQList();
showPage('test');

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'test') renderTest();
}

function saveSettings() {
  localStorage.setItem('companyName', document.getElementById('companyName').value);
  localStorage.setItem('philosophy', document.getElementById('philosophy').value);
  alert('保存しました');
}

function addQuestion() {
  const text = document.getElementById('newQ').value.trim();
  if (!text) return;
  questions.push({ id: Date.now(), text, modelAnswer: document.getElementById('newModel').value.trim() });
  localStorage.setItem('questions', JSON.stringify(questions));
  document.getElementById('newQ').value = '';
  document.getElementById('newModel').value = '';
  renderQList();
}

function removeQuestion(id) {
  questions = questions.filter(q => q.id !== id);
  localStorage.setItem('questions', JSON.stringify(questions));
  renderQList();
}

function renderQList() {
  document.getElementById('qCount').textContent = questions.length + ' 問登録済み';
  const el = document.getElementById('qList');
  if (!questions.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="divider"></div><h1 style="font-size:18px;margin-bottom:18px">登録済みの問題</h1>' +
    questions.map((q, i) => `
      <div class="card" style="position:relative">
        <div class="q-num">問題 ${i+1}</div>
        <div style="font-size:14px;line-height:1.6;margin-bottom:${q.modelAnswer?'10px':'0'}">${q.text}</div>
        ${q.modelAnswer ? `<div style="font-size:11px;color:var(--muted);font-style:italic">模範：${q.modelAnswer}</div>` : ''}
        <button class="btn danger" style="position:absolute;top:18px;right:18px" onclick="removeQuestion(${q.id})">削除</button>
      </div>
    `).join('');
}

function renderTest() {
  const companyName = localStorage.getItem('companyName') || '当社';
  const el = document.getElementById('testContent');
  if (!questions.length) {
    el.innerHTML = '<h1>テスト未設定</h1><div class="sub">管理者設定から問題を追加してください。</div>';
    return;
  }
  el.innerHTML = `
    <h1>${companyName} — 理念テスト</h1>
    <div class="sub">全 ${questions.length} 問｜記述式</div>
    <div class="card">
      <label>受験者名</label>
      <input id="testerName" placeholder="氏名を入力してください">
    </div>
    <div class="divider"></div>
    ${questions.map((q, i) => `
      <div class="card" style="margin-bottom:16px">
        <div class="q-num">問題 ${i+1} / ${questions.length}</div>
        <div class="q-text">${q.text}</div>
        <textarea id="ans_${q.id}" rows="5" placeholder="ここに回答を入力してください..." oninput="document.getElementById('cnt_${q.id}').textContent=this.value.length+'字'"></textarea>
        <div class="char-count" id="cnt_${q.id}">0字</div>
      </div>
    `).join('')}
    <button class="btn" id="submitBtn" style="width:100%;padding:15px;font-size:11px" onclick="submitTest()">提出して採点する</button>
  `;
}

async function submitTest() {
  const name = document.getElementById('testerName').value.trim();
  const allFilled = questions.every(q => document.getElementById('ans_' + q.id).value.trim());
  if (!name || !allFilled) { alert('氏名と全問題の回答を入力してください'); return; }

  const companyName = localStorage.getItem('companyName') || '当社';
  const philosophy = localStorage.getItem('philosophy') || '';
  const loading = document.getElementById('loading');
  const loadingMsg = document.getElementById('loadingMsg');
  loading.classList.add('show');

  const results = [];
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    const answer = document.getElementById('ans_' + q.id).value;
    loadingMsg.textContent = `問題 ${i+1} / ${questions.length} を採点中...`;

    const prompt = `あなたは会社理念テストの採点者です。
【会社名】${companyName}
【会社理念】${philosophy}
【問題】${q.text}${q.modelAnswer ? '\n【模範解答参考】' + q.modelAnswer : ''}
【受験者の回答】${answer}

以下のJSON形式のみで返してください（他の文字は一切含めない）：
{"score":点数(0-100の整数),"feedback":"フィードバック200字以内","points":"良かった点","improvement":"改善点"}`;

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await res.json();
      const text = (data.content || []).map(c => c.text || '').join('');
      const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
      results.push({ question: q.text, answer, ...parsed });
    } catch(e) {
      results.push({ question: q.text, answer, score: 0, feedback: '採点エラー', points: '-', improvement: '-' });
    }
  }

  loading.classList.remove('show');
  const avg = Math.round(results.reduce((s, r) => s + (r.score || 0), 0) / results.length);
  resultData = { name, results, avg };

  // Googleスプレッドシートに送信
  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, avg, results })
  }).catch(() => {});

  renderResult();
  document.getElementById('nav-result').style.display = '';
  showPage('result');
}

function renderResult() {
  if (!resultData) return;
  const { name, results, avg } = resultData;
  const color = avg >= 80 ? 'var(--success)' : avg >= 50 ? 'var(--accent)' : 'var(--danger)';

  document.getElementById('resultContent').innerHTML = `
    <div class="result-header">
      <div style="font-size:11px;color:var(--accent);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px">採点結果</div>
      <div style="font-size:32px;margin-bottom:8px">${name}</div>
      <div class="result-score" style="color:${color}">${avg}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">総合スコア（100点満点）</div>
      <div class="score-wrap" style="width:180px;margin:14px auto 0">
        <div class="score-fill" style="width:${avg}%;background:${color}"></div>
      </div>
    </div>
    <div class="divider"></div>
    ${results.map((r, i) => {
      const c = r.score >= 80 ? 'var(--success)' : r.score >= 50 ? 'var(--accent)' : 'var(--danger)';
      return `
        <div class="card" style="margin-bottom:18px">
          <div class="q-num">問題 ${i+1}</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6">${r.question}</div>
          <div class="answer-box">${r.answer}</div>
          <div class="tag" style="color:${c};border-color:${c}">${r.score}点</div>
          <div class="score-wrap"><div class="score-fill" style="width:${r.score}%;background:${c}"></div></div>
          <div class="fb-section" style="margin-top:18px;display:grid;gap:12px">
            <div><div class="fb-label" style="color:var(--success)">良かった点</div><div class="fb-text">${r.points}</div></div>
            <div><div class="fb-label" style="color:var(--danger)">改善点</div><div class="fb-text">${r.improvement}</div></div>
            <div><div class="fb-label" style="color:var(--accent)">総合フィードバック</div><div class="fb-text">${r.feedback}</div></div>
          </div>
        </div>
      `;
    }).join('')}
    <div style="text-align:center;margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn outline" onclick="showPage('test');renderTest()">もう一度受ける</button>
      <button class="btn" onclick="window.print()">印刷・保存</button>
    </div>
  `;
}

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
